; RetailForge AI integration policy
; This file is intentionally provider-agnostic. Secrets must be supplied through
; environment variables or a managed secret store, never committed here.

[runtime]
cloud_provider_target=managed-webdev
execution_mode=demo
transport=typed-rpc

[ai]
routing_policy=cost-aware-safe-default
routine_provider=demo-structured
reasoning_provider=manual-review
min_confidence_for_auto_approval=0.95
cache_ttl_hours=48

[plm]
provider=generic-rest-demo
enabled=false
base_url=

[design]
provider=svg-demo
enabled=true
base_url=

[erp]
provider=generic-rest-demo
enabled=false
base_url=

[event_bus]
provider=in-process-demo
ordered_partition_key=tenant_id:product_id
max_retries=5
backoff_strategy=exponential-jitter
[s3]
provider=managed-object-store
bucket=
